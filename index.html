<!doctype html>
<html lang="ku" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>pole12krd — AI Teacher</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><b>pole12krd</b><nav><a href="#teacher">AI Teacher</a><a href="#tools">ئامرازەکان</a></nav></header>
<section class="hero"><small>خوێندنەوە • تێگەیشتن • سەرکەوتن</small><h1>یاریدەدەری خوێندنت بە کوردیی ڕوون</h1><p>پرسیار بکە و وەڵامێکی کورت، پوخت و فێرکاری وەربگرە.</p><a class="btn" href="#teacher">دەست پێ بکە</a></section>
<main>
<section id="teacher" class="card"><h2>🤖 AI Teacher</h2>
<div class="grid">
<label>ئاست<select id="level"><option>پۆلی ١٢</option><option>زانکۆ</option><option>گشتی</option></select></label>
<label>بابەت<select id="subject"><option>گشتی</option><option>بیرکاری</option><option>فیزیا</option><option>کیمیا</option><option>ئینگلیزی</option><option>کۆمپیوتەر</option></select></label>
<label>شێواز<select id="mode"><option>کورت و پوخت</option><option>هەنگاو بە هەنگاو</option><option>تاقیکردنەوە</option></select></label>
</div><textarea id="question" rows="5" placeholder="پرسیارەکەت لێرە بنووسە..."></textarea>
<button class="btn" id="ask">وەڵام بدەرەوە</button><div id="answer" class="answer"></div></section>
<section id="tools" class="card"><h2>📚 ئامرازەکان</h2><p>PDF هەڵبژێرە بۆ خوێندنەوەی دەق و ئامادەکردنی پوختە.</p>
<input id="pdf" type="file" accept="application/pdf"><button class="btn secondary" id="makeTools">خوێندنەوەی PDF</button><div id="toolsOut"></div></section>
</main><footer>© pole12krd</footer>
<script type="module" src="app.js"></script></body></html>
